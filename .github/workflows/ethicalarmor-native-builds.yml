name: EthicalArmor Native Builds

on:
  workflow_dispatch:
  push:
    branches: [hardening/postgres-multiuser-foundation]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Linux Qt dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libnss3 libasound2 libxkbcommon-x11-0 libxcb-cursor0 libxkbfile1 libxtst6 fontconfig
      - name: Install build and test dependencies
        run: python -m pip install -r requirements.txt "pyinstaller>=6,<7" "pytest>=8,<10"
      - name: Focused GUI and packaging tests
        run: python -m pytest -q tests/test_investigation_workflow.py tests/test_packaging_metadata.py tests/test_release_check.py tests/test_native_build_tools.py tests/test_github_source_push.py
      - name: Compile native desktop client
        run: python tools/build_desktop.py
      - name: Archive native bundle
        run: python tools/package_desktop.py
      - uses: actions/upload-artifact@v7
        with:
          name: EthicalArmor-${{ runner.os }}-${{ runner.arch }}
          path: release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
