services:
  db:
    image: postgres:15
    container_name: telecom_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: telecom_forensics
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d telecom_forensics"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..          # project root
      dockerfile: backend/Dockerfile
    container_name: telecom_api
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/telecom_forensics
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-this}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  postgres_data: