  <line x1="256" y1="90" x2="256" y2="130" stroke="#00F5D4" stroke-width="3" stroke-opacity="0.6"/>
  <circle cx="256" cy="412" r="6" fill="#00BBF9"/>
  <line x1="256" y1="372" x2="256" y2="406" stroke="#00BBF9" stroke-width="3" stroke-opacity="0.6"/>

