[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "telecom-forensics-analysis-suite"
version = "1.0.0"
description = "Case-oriented telecom record analysis and reporting suite"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<4",
  "openpyxl>=3.1,<4",
  "duckdb",
  "pyarrow",
  "pyxlsb>=1.0.10",
  "pytz>=2024.1",
  "PySide6>=6.8,<7",
  "requests>=2.31,<3",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",
  "SQLAlchemy>=2.0,<3",
  "psycopg[binary]>=3.1,<4",
  "python-dotenv>=1.0",
  "python-jose>=3.3",
  "bcrypt>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27", "ruff>=0.5"]

[project.scripts]
telecom-forensics = "main:main"

[project.gui-scripts]
telecom-forensics-gui = "gui.app:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["modules*", "gui*", "backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]
filterwarnings = [
  "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:fastapi.*",
  "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:starlette.*",
]

[tool.ruff]
line-length = 100

[tool.black]
line-length = 100



[tool.setuptools.package-data]
"modules.reporting" = ["assets/*.js", "assets/*.css", "assets/*.txt"]
