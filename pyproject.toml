[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "telecom-forensics-analysis-suite"
version = "0.9.0rc1"
description = "Case-oriented telecom record analysis and reporting suite"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<4",
  "openpyxl>=3.1,<4",
  "duckdb",
  "pyarrow",
  "pyxlsb>=1.0.10",
  "pytz>=2024.1",
  "PySide6>=6.8,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
telecom-forensics = "main:main"

[project.gui-scripts]
telecom-forensics-gui = "gui.app:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["modules*", "gui*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]
